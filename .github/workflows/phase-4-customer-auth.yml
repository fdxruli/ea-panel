name: Phase 4 Customer Auth

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-4-customer-auth-frontend]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SKIP_DYNAMIC_SITEMAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
